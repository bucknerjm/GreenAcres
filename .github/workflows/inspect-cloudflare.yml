name: Inspect Green Acres runtime settings
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/inspect-cloudflare.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read connection metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID.trim()+'/workers/scripts/green-acres';
          const response=await fetch(base+'/settings',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN.trim()}});
          const result=await response.json();
          if(!response.ok||!result.success)throw Error('Settings read failed');
          console.log(JSON.stringify((result.result.bindings||[]).map(b=>({name:b.name,type:b.type,keys:Object.keys(b).sort(),...(b.type==='d1'?{matchesExistingDatabase:b.id==='104cf1b5-8bcd-4038-87ac-74e04f68efeb'}:{}),...(['DATABASE_ACCESS','SCHEDULED_WORK'].includes(b.name)?{mode:b.text}:{})}))));
          const codeResponse=await fetch(base,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN.trim()}});
          if(!codeResponse.ok)throw Error('Code version read failed');
          const code=await codeResponse.text();
          console.log('Live uploaded source version: '+(code.match(/const APP_VERSION\s*=\s*(\d+)/)?.[1]||'unknown'));
          const auth={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN.trim()};
          for(const path of ['/versions','/deployments']){
            const reply=await fetch(base+path,{headers:auth});const value=await reply.json();
            const items=value.result?.items||value.result?.deployments||[];
            console.log(path,JSON.stringify(items.slice(0,8).map(x=>({id:x.id,created_on:x.created_on||x.metadata?.created_on,source:x.source||x.metadata?.source,trigger:x.annotations?.['workers/triggered_by'],versions:x.versions}))));
          }
          const listReply=await fetch(base.replace('/scripts/green-acres','/scripts'),{headers:auth});const list=await listReply.json();const worker=(list.result||[]).find(x=>x.id==='green-acres');
          if(worker?.tag){const reply=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID.trim()+'/builds/workers/'+worker.tag+'/triggers',{headers:auth});const value=await reply.json();console.log('Build triggers HTTP '+reply.status);if(reply.ok)console.log(JSON.stringify(value.result));}
          const oldVersionResponse=await fetch(base+'/versions/9b22e4df-0c6c-4c0b-b02e-1d2ddf25af51',{headers:auth});
          const oldVersion=await oldVersionResponse.json();
          if(oldVersionResponse.ok){const v=oldVersion.result;console.log('Replacement version origin',JSON.stringify({source:v.metadata?.source,metadataFields:Object.keys(v.metadata||{}),annotationFields:Object.keys(v.annotations||{}),annotations:Object.fromEntries(Object.entries(v.annotations||{}).filter(([key])=>/triggered_by|build_id|build_trigger|git_commit|git_branch|message/.test(key)))}));}
          const liveResponse=await fetch('https://greenacresaz.com/login',{cache:'no-store'});
          const login=await liveResponse.text();
          console.log(JSON.stringify({loginStatus:liveResponse.status,databasePaused:login.includes('DATABASE_PAUSED')}));
          if(liveResponse.status!==200||login.includes('DATABASE_PAUSED'))throw Error('Live login page is unavailable');
          JS
